<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Login — Central Baptist Church Wakiso</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css" />
</head>
<body>
<div class="login-shell">
  <div class="login-card">
    <div class="brand-mark">
      <img src="../assets/logo-source.png" alt="Central Baptist Church Wakiso crest" />
      <strong style="font-family:var(--font-display); color:var(--navy-900);">Admin</strong>
    </div>
    <h2 style="margin-bottom:6px;">Sign in</h2>
    <p style="margin-bottom:22px; color:var(--ink-400); font-size:0.9rem;">Manage the homepage, images and messages.</p>
    <form id="loginForm">
      <div class="field" style="margin-bottom:14px;">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username" />
      </div>
      <div class="field" style="margin-bottom:18px;">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Sign In</button>
      <p class="login-error" id="loginError">Incorrect email or password.</p>
    </form>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script>
  auth.onAuthStateChanged((user) => {
    if (user) window.location.href = "dashboard.html";
  });

  const form = document.getElementById("loginForm");
  const errorEl = document.getElementById("loginError");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.classList.remove("is-visible");
    try {
      await auth.signInWithEmailAndPassword(
        document.getElementById("email").value.trim(),
        document.getElementById("password").value
      );
      window.location.href = "dashboard.html";
    } catch (err) {
      console.error(err);
      errorEl.textContent = err.message.replace(/^Firebase:\s*/, "");
      errorEl.classList.add("is-visible");
    }
  });
</script>
</body>
</html>
